server.port=8080
spring.application.name=flashcard-data-service

# Drive Storage Settings
# When google.drive.enabled=true and credentials-path is provided, cloud Drive is used.
# Otherwise, zero-config local simulated Drive storage is used.
google.drive.enabled=${GOOGLE_DRIVE_ENABLED:false}
google.drive.credentials-path=${GOOGLE_DRIVE_CREDENTIALS_PATH:}

# Local Drive Simulator directory (relative to running directory)
drive.local.store-dir=${DRIVE_STORE_DIR:./drive_store}

# Jackson Formats
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Logging
logging.level.com.example.flashcards=DEBUG
logging.level.org.springframework.web=INFO
